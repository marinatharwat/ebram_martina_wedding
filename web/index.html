<!DOCTYPE html>
<html>
<head>
    <base href="$FLUTTER_BASE_HREF">

    <meta charset="UTF-8">
    <meta content="IE=Edge" http-equiv="X-UA-Compatible">

    <meta
            name="description"
            content="Ebram & Martina Wedding Invitation"
    >

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
    >

    <meta
            name="apple-mobile-web-app-capable"
            content="yes"
    >

    <meta
            name="apple-mobile-web-app-status-bar-style"
            content="default"
    >

    <meta
            name="apple-mobile-web-app-title"
            content="Ebram & Martina"
    >

    <title>Ebram & Martina — Wedding Invitation</title>

    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="logo.png">

    <!-- Open Graph / WhatsApp / Facebook -->
    <meta property="og:type" content="website">

    <meta
            property="og:title"
            content="Ebram & Martina — Wedding Invitation"
    >

    <meta
            property="og:description"
            content="You have received an invitation from Ebram & Martina"
    >

    <meta
            property="og:image"
            content="https://ebram-martina-wedding.vercel.app//logo.png"
    >

    <meta
            property="og:url"
            content="https://ebram-martina-wedding.vercel.app//"
    >

    <!-- Twitter -->
    <meta
            name="twitter:card"
            content="summary_large_image"
    >

    <meta
            name="twitter:title"
            content="Ebram & Martina — Wedding Invitation"
    >

    <meta
            name="twitter:description"
            content="You have received an invitation from Ebram & Martina"
    >

    <meta
            name="twitter:image"
            content="https://ebram-martina-wedding.vercel.app//logo.png"
    >

    <!-- Fonts -->
    <link
            rel="preconnect"
            href="https://fonts.googleapis.com"
    >

    <link
            rel="preconnect"
            href="https://fonts.gstatic.com"
            crossorigin
    >

    <link
            href="https://fonts.googleapis.com/css2?family=Italianno&family=Jost:wght@400;500&family=Marcellus&display=swap"
            rel="stylesheet"
    >

    <style>

        /* =====================================================
           RESET
        ===================================================== */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            background: #FFFCF8;
            font-family: Georgia, serif;
        }


        /* =====================================================
           COLORS
        ===================================================== */

        :root {

            --paper: #FFFCF8;
            --cream: #F7F1E8;

            --sage: #A8B59A;
            --sage-light: #DDE3D5;
            --olive: #737F62;

            --blush: #E8B8B3;
            --dusty-rose: #C98F8A;
            --terracotta: #B97868;

            --gold: #C7A66A;

            --ink: #3E4638;
            --ink-soft: #756F63;

            --rosee: #EEA1AB;
        }


        /* =====================================================
           SPLASH
        ===================================================== */

        #loading {

            position: fixed;

            inset: 0;

            width: 100%;
            height: 100%;

            display: flex;

            align-items: center;

            justify-content: center;

            overflow: hidden;

            text-align: center;

            background:
                radial-gradient(
                    circle at 50% 35%,
                    #F7F1E8 0%,
                    #FFFCF8 48%,
                    #FFFCF8 100%
                );

            z-index: 9999;

            opacity: 1;

            transition:
                opacity .8s ease,
                visibility .8s ease;
        }


        #loading.hide {

            opacity: 0;

            visibility: hidden;

            pointer-events: none;
        }


        /* =====================================================
           BACKGROUND GLOW
        ===================================================== */

        .background-glow {

            position: absolute;

            width: 460px;
            height: 460px;

            left: 50%;
            top: 45%;

            transform:
                translate(-50%, -50%);

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(221, 227, 213, .55) 0%,
                    rgba(221, 227, 213, .20) 42%,
                    transparent 72%
                );

            animation:
                glowPulse
                4s
                ease-in-out
                infinite;
        }


        /* =====================================================
           CONTENT
        ===================================================== */

        .splash-content {

            position: relative;

            z-index: 5;

            width: 100%;

            min-height: 100%;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            padding: 30px 24px;
        }


        /* =====================================================
           TOP TEXT
        ===================================================== */

        .eyebrow {

            font-family:
                'Marcellus',
                Georgia,
                serif;

            color:
                var(--olive);

            font-size: 10px;

            letter-spacing: 3px;

            text-transform: uppercase;

            margin-bottom: 20px;

            opacity: 0;

            animation:
                fadeUp
                .9s
                ease
                forwards
                .15s;
        }


        /* =====================================================
           RINGS IMAGE
        ===================================================== */

        .rings {

            width: 105px;

            height: 75px;

            display: flex;

            align-items: center;

            justify-content: center;

            margin-bottom: 28px;

            opacity: 0;

            animation:
                ringEntrance
                1.1s
                cubic-bezier(.22,1,.36,1)
                forwards
                .35s;
        }


        .rings img {

            width: 100%;

            height: 100%;

            object-fit: contain;

            display: block;

            filter:
                drop-shadow(
                    0 7px 12px
                    rgba(
                        199,
                        166,
                        106,
                        .18
                    )
                );
        }


        /* =====================================================
           NAMES
        ===================================================== */

        .names {

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            font-family:
                'Italianno',
                cursive;

            color:
                var(--terracotta);

            line-height: .82;

            opacity: 0;

            animation:
                namesEntrance
                1.1s
                cubic-bezier(.22,1,.36,1)
                forwards
                .7s;
        }


        .name {

            font-size:
                clamp(
                    62px,
                    16vw,
                    88px
                );

            display: block;
        }


        .amp {

            font-size:
                clamp(
                    27px,
                    6vw,
                    36px
                );

            color:
                var(--dusty-rose);

            line-height: 1;

            margin:
                5px 0
                2px;
        }


        /* =====================================================
           SUBTITLE
        ===================================================== */

        .invitation-line {

            font-family:
                'Marcellus',
                Georgia,
                serif;

            color:
                var(--olive);

            font-size: 9px;

            letter-spacing: 3px;

            text-transform: uppercase;

            margin-top: 34px;

            opacity: 0;

            animation:
                fadeUp
                .9s
                ease
                forwards
                1.1s;
        }


        /* =====================================================
           DIVIDER
        ===================================================== */

        .divider {

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 9px;

            margin-top: 22px;

            opacity: 0;

            animation:
                fadeUp
                .8s
                ease
                forwards
                1.25s;
        }


        .divider-line {

            width: 28px;

            height: 1px;

            background:
                var(--gold);

            opacity: .55;
        }


        .divider-dot {

            width: 4px;

            height: 4px;

            border-radius: 50%;

            background:
                var(--gold);
        }


        /* =====================================================
           PROGRESS AREA
        ===================================================== */

        .progress-area {

            width: 145px;

            margin-top: 34px;

            opacity: 0;

            animation:
                fadeUp
                .8s
                ease
                forwards
                1.4s;
        }


        .progress-track {

            position: relative;

            width: 100%;

            height: 2px;

            border-radius: 10px;

            overflow: hidden;

            background:
                rgba(
                    168,
                    181,
                    154,
                    .22
                );
        }


        .progress-bar {

            position: absolute;

            left: -40%;

            top: 0;

            height: 100%;

            width: 35%;

            border-radius: 10px;

            background:
                linear-gradient(
                    90deg,
                    var(--sage),
                    var(--gold),
                    var(--blush)
                );

            animation:
                loadingProgress
                1.8s
                ease-in-out
                infinite;
        }


        .progress-label {

            margin-top: 10px;

            font-family:
                'Jost',
                sans-serif;

            font-size: 8px;

            letter-spacing: 2.5px;

            color:
                var(--ink-soft);

            text-transform: uppercase;
        }


        /* =====================================================
           ANIMATIONS
        ===================================================== */

        @keyframes fadeUp {

            from {

                opacity: 0;

                transform:
                    translateY(14px);
            }

            to {

                opacity: 1;

                transform:
                    translateY(0);
            }
        }


        @keyframes ringEntrance {

            from {

                opacity: 0;

                transform:
                    translateY(18px)
                    scale(.72)
                    rotate(-8deg);
            }

            to {

                opacity: 1;

                transform:
                    translateY(0)
                    scale(1)
                    rotate(0);
            }
        }


        @keyframes namesEntrance {

            from {

                opacity: 0;

                transform:
                    translateY(20px)
                    scale(.94);
            }

            to {

                opacity: 1;

                transform:
                    translateY(0)
                    scale(1);
            }
        }


        @keyframes loadingProgress {

            0% {

                left: -40%;

                width: 35%;
            }

            50% {

                left: 35%;

                width: 45%;
            }

            100% {

                left: 105%;

                width: 35%;
            }
        }


        @keyframes glowPulse {

            0%,
            100% {

                transform:
                    translate(-50%, -50%)
                    scale(.95);

                opacity: .6;
            }

            50% {

                transform:
                    translate(-50%, -50%)
                    scale(1.06);

                opacity: .95;
            }
        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 600px) {

            .splash-content {

                padding:
                    24px
                    18px;
            }


            .eyebrow {

                font-size: 8.5px;

                letter-spacing: 2px;

                margin-bottom: 20px;
            }


            .rings {

                width: 98px;

                height: 70px;

                margin-bottom: 24px;
            }


            .name {

                font-size:
                    clamp(
                        58px,
                        17vw,
                        78px
                    );
            }


            .amp {

                font-size: 27px;

                margin:
                    5px 0
                    1px;
            }


            .invitation-line {

                font-size: 8px;

                letter-spacing: 2.2px;

                margin-top: 28px;
            }


            .divider {

                margin-top: 19px;
            }


            .progress-area {

                width: 130px;

                margin-top: 28px;
            }


            .progress-label {

                font-size: 7px;

                letter-spacing: 2px;
            }


            .background-glow {

                width: 340px;

                height: 340px;
            }
        }


        /* =====================================================
           SHORT SCREENS
        ===================================================== */

        @media (max-height: 680px) {

            .eyebrow {

                margin-bottom: 12px;
            }


            .rings {

                width: 88px;

                height: 63px;

                margin-bottom: 18px;
            }


            .name {

                font-size: 58px;
            }


            .invitation-line {

                margin-top: 22px;
            }


            .divider {

                margin-top: 15px;
            }


            .progress-area {

                margin-top: 22px;
            }
        }


        /* =====================================================
           VERY SHORT MOBILE
        ===================================================== */

        @media (
            max-width: 600px
        ) and (
            max-height: 600px
        ) {

            .splash-content {

                padding-top: 15px;

                padding-bottom: 15px;
            }


            .eyebrow {

                margin-bottom: 8px;

                font-size: 7.5px;
            }


            .rings {

                width: 80px;

                height: 57px;

                margin-bottom: 12px;
            }


            .name {

                font-size: 52px;
            }


            .amp {

                font-size: 24px;

                margin: 3px 0;
            }


            .invitation-line {

                margin-top: 16px;

                font-size: 7px;
            }


            .divider {

                margin-top: 11px;
            }


            .progress-area {

                margin-top: 16px;
            }
        }


        /* =====================================================
           REDUCED MOTION
        ===================================================== */

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {

                animation: none !important;

                transition: none !important;
            }


            #loading,
            .eyebrow,
            .rings,
            .names,
            .invitation-line,
            .divider,
            .progress-area {

                opacity: 1;
            }


            .progress-bar {

                left: 0;

                width: 100%;
            }
        }

    </style>
</head>


<body>

<div id="loading">

    <!-- Background Glow -->

    <div class="background-glow"></div>


    <!-- =====================================================
         SPLASH CONTENT
    ===================================================== -->

    <div class="splash-content">


        <!-- Invitation Header -->

        <div class="eyebrow">

            YOU'RE INVITED TO THE WEDDING OF

        </div>


        <!-- Wedding Rings -->

        <div class="rings">

            <img
                    src="assets/assets/images/wedding_rings.png"
                    alt="Ebram and Martina Wedding Rings"
            >

        </div>


        <!-- Names -->

        <div class="names">

            <span class="name">
                Ebram
            </span>

            <span class="amp">
                &amp;
            </span>

            <span class="name">
                Martina
            </span>

        </div>


        <!-- Invitation Subtitle -->

        <div class="invitation-line">

            A BEAUTIFUL BEGINNING

        </div>


        <!-- Decorative Divider -->

        <div class="divider">

            <div class="divider-line"></div>

            <div class="divider-dot"></div>

            <div class="divider-line"></div>

        </div>


        <!-- Loading Progress -->

        <div class="progress-area">

            <div class="progress-track">

                <div class="progress-bar"></div>

            </div>

            <div class="progress-label">

                PREPARING YOUR INVITATION

            </div>

        </div>


    </div>

</div>


<!-- =====================================================
     FLUTTER BOOTSTRAP
===================================================== -->

<script
        src="flutter_bootstrap.js"
        async>
</script>


<script>

    /* =====================================================
       MEDIA SESSION
    ===================================================== */

    if ('mediaSession' in navigator) {

        navigator.mediaSession.metadata = null;

    }


    /* =====================================================
       PREVENT INSTALL BANNER
    ===================================================== */

    window.addEventListener(
        'beforeinstallprompt',
        (e) => {

            e.preventDefault();

            e.stopPropagation();

            return false;

        }
    );


    /* =====================================================
       SPLASH LOGIC
    ===================================================== */

    const splashStartTime =
        Date.now();

    // Minimum time the splash stays visible, no matter how fast
    // Flutter/images finish — bumped to 3s (was 2s) so it never
    // feels like it "skips" the splash on fast connections.
    const minSplashDuration =
        3000;


    let splashHidden =
        false;


    let flutterReady =
        false;

    let imagesReady =
        false;

    // Preload the two hero images used right after the splash, so
    // they don't visibly pop/flash in once the loading screen is
    // gone. Flutter Web serves assets under assets/assets/... — same
    // pattern as the rest of this file's images.
    const criticalImages = [
        'assets/assets/images/b.png',
        'assets/assets/images/2.png',
    ];

    let loadedCount = 0;

    criticalImages.forEach((src) => {
        const img = new Image();
        img.onload = img.onerror = () => {
            loadedCount++;
            if (loadedCount === criticalImages.length) {
                imagesReady = true;
                tryHideSplash();
            }
        };
        img.src = src;
    });


    function tryHideSplash() {

        if (
            !flutterReady ||
            !imagesReady ||
            splashHidden
        ) {

            return;

        }


        splashHidden = true;


        const elapsed =
            Date.now() -
            splashStartTime;


        const remainingTime =
            Math.max(
                0,
                minSplashDuration -
                elapsed
            );


        setTimeout(() => {

            const loading =
                document.getElementById(
                    'loading'
                );


            if (!loading) {

                return;

            }


            loading.classList.add(
                'hide'
            );


            setTimeout(() => {

                loading.remove();

            }, 800);

        }, remainingTime);

    }


    /* =====================================================
       FLUTTER FIRST FRAME
    ===================================================== */

    window.addEventListener(
        'flutter-first-frame',
        () => {

            flutterReady = true;

            tryHideSplash();

        }
    );


    /* =====================================================
       SAFETY NET
    ===================================================== */

    setTimeout(() => {

        flutterReady = true;

        imagesReady = true;

        tryHideSplash();

    }, 8000);

</script>

</body>
</html>
